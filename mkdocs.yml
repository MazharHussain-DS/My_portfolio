site_name: Mazhar Hussain
site_description: Documentation for Mazhar
site_author: Mazhar


theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - content.code.annotate
    - content.action.edit
    - content.tabs.link
    - content.tooltips
    - toc.integrate
    - search.highlight
    - search.suggest
    - header.autohide
    - announce.dismiss
  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github
  favicon: images/favicon.ico  # Add your favicon
  logo: images/logo.png        # Add your logo

nav:
  - Home: index.md
  - Projects: Projects.md
  - Blogs: Blogs.md
  - Skills: Skills.md
  - Resume: Resume.md
  - About: about.md

markdown_extensions:
  - admonition
  - footnotes
  - def_list
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.magiclink

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MazharHussain-DS
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/mazhar-hussain
  generator: false

plugins:
  - search
 # - awesome-pages
 # - glightbox

extra_css:
  - stylesheets/extra.css  # Create this file for custom styles (optional)

extra_javascript:
  - javascripts/extra.js  # Optional: add custom JS here
